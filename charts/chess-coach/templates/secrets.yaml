{{- if not .Values.session.existingSecret }}
{{- $name := printf "%s-session" (include "chess-coach.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chess-coach.labels" . | nindent 4 }}
type: Opaque
data:
  session-secret: {{ if $existing }}{{ index $existing.data "session-secret" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
{{- $pgName := printf "%s-postgresql" (include "chess-coach.fullname" .) }}
{{- $pgExisting := lookup "v1" "Secret" .Release.Namespace $pgName }}
{{- $password := .Values.postgresql.password }}
{{- if and (not $password) $pgExisting }}
{{- $password = index $pgExisting.data "postgres-password" | b64dec }}
{{- else if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "chess-coach.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username $password (include "chess-coach.fullname" .) .Values.postgresql.database | quote }}
{{- end }}

