apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chess-coach.fullname" . }}-migrate
  labels:
    {{- include "chess-coach.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "chess-coach.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "chess-coach.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "chess-coach.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: CHESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "chess-coach.databaseSecret" . }}
                  key: database-url
            - name: CHESS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "chess-coach.sessionSecret" . }}
                  key: session-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi

