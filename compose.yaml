name: chess-coach

services:
  database:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: chesscoach
      POSTGRES_USER: chesscoach
      POSTGRES_PASSWORD: local-development-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chesscoach -d chesscoach"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Containerfile
    command: ["migrate"]
    environment: &app-environment
      CHESS_DATABASE_URL: postgresql+psycopg://chesscoach:local-development-password@database:5432/chesscoach
      CHESS_SESSION_SECRET: local-development-secret-change-me
      CHESS_COOKIE_SECURE: "false"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Containerfile
    command: ["web"]
    environment: *app-environment
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: Containerfile
    command: ["worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:

